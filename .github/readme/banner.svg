<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0f17"/>
      <stop offset="100%" stop-color="#141827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00aaff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00aaff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <circle cx="1030" cy="70" r="220" fill="url(#glow)"/>

  <!-- window chrome mockup -->
  <g transform="translate(760,60)">
    <rect width="380" height="170" rx="12" fill="#171b28" stroke="#262a3a" stroke-width="1.5"/>
    <rect width="380" height="30" rx="12" fill="#1c2030"/>
    <circle cx="20" cy="15" r="5" fill="#ff5f57"/>
    <circle cx="38" cy="15" r="5" fill="#febc2e"/>
    <circle cx="56" cy="15" r="5" fill="#28c840"/>
    <rect x="24" y="50" width="332" height="14" rx="4" fill="url(#accent)" opacity="0.85"/>
    <rect x="24" y="76" width="220" height="10" rx="4" fill="#3a3f52"/>
    <rect x="24" y="94" width="270" height="10" rx="4" fill="#3a3f52"/>
    <rect x="24" y="124" width="110" height="28" rx="7" fill="url(#accent)"/>
    <rect x="146" y="124" width="90" height="28" rx="7" fill="#20242f" stroke="#2c3143"/>
  </g>

  <text x="70" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" fill="#eef0f6">Pywix</text>
  <text x="74" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#9aa0b8">Turn Python scripts into Windows .exe apps — no terminal required.</text>

  <rect x="70" y="188" width="230" height="4" rx="2" fill="url(#accent)"/>
</svg>
